<!-- Dark mode: restore theme before paint -->
<script>
  (function(){
    var t = localStorage.getItem('theme');
    if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>

<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .editorial-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 1.5rem;
  }
  body {
    font-family: 'Inter', sans-serif;
    background-color: #fcf9f8;
    color: #1b1c1c;
  }
  img {
    -webkit-user-drag: none;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ===== Dark Mode Overrides ===== */
  html.dark body {
    background-color: #0f1117 !important;
    color: #e4e2e1 !important;
  }
  /* Nav */
  html.dark nav { background: rgba(15,17,23,0.7) !important; border-color: rgba(65,71,85,0.15) !important; }
  html.dark nav a { color: #c1c6d7; }
  html.dark nav a:hover { color: #e4e2e1; }
  /* Body text & variants */
  html.dark .bg-surface { background-color: #0f1117 !important; }
  html.dark .text-on-surface { color: #e4e2e1 !important; }
  html.dark .text-on-surface-variant { color: #c1c6d7 !important; }
  html.dark .text-primary { color: #adc6ff !important; }
  html.dark .text-secondary { color: #b9c7df !important; }
  /* Surface containers */
  html.dark .bg-surface-container-low { background-color: #1a1d24 !important; }
  html.dark .bg-surface-container { background-color: #22262d !important; }
  html.dark .bg-surface-container-high { background-color: #2a2e36 !important; }
  html.dark .bg-surface-container-highest { background-color: #363a42 !important; }
  /* Primary surfaces */
  html.dark .bg-primary { background-color: #1a4a8a !important; }
  html.dark .text-on-primary { color: #d8e2ff !important; }
  html.dark .bg-primary-fixed { background-color: #002e6a !important; }
  /* Secondary surfaces */
  html.dark .bg-secondary-container { background-color: #3a485b !important; }
  html.dark .text-on-secondary-container { color: #d5e3fc !important; }
  /* Borders */
  html.dark [class*="border-outline-variant"] { border-color: rgba(65,71,85,0.2) !important; }
  /* Specific overrides for inline-styled elements */
  html.dark .dark-nav-bg { background: rgba(15,17,23,0.7) !important; border-color: rgba(65,71,85,0.15) !important; }
  html.dark .dark-contact-btn { background: #1a4a8a !important; }
  html.dark .dark-card-bg { background-color: #1a1d24 !important; }
  html.dark .dark-surface-bg { background-color: #0f1117 !important; }
  /* Heading/text in dark */
  html.dark h1, html.dark h2, html.dark h3, html.dark h4 { color: #e4e2e1; }
  html.dark p { color: #c1c6d7; }
  html.dark .font-mono { color: #8a8f9c; }
  /* Number indicators */
  html.dark .honor-num { color: #2a2e36 !important; }
  html.dark .group:hover .honor-num { color: rgba(173,198,255,0.4) !important; }
  /* Chips */
  html.dark [class*="bg-primary\\/10"], html.dark .dark-chip { background-color: rgba(173,198,255,0.12) !important; color: #adc6ff !important; }
  /* Publication cards */
  html.dark .pub-card-border { border-color: #1a4a8a !important; }
  html.dark .pub-card-border-secondary { border-color: #3a485b !important; }
  html.dark .dark-card-inner { background-color: #0f1117 !important; border-color: rgba(65,71,85,0.1) !important; }
  /* Footer */
  html.dark footer { background-color: #0f1117 !important; border-color: rgba(65,71,85,0.15) !important; }

  /* ===== Language toggle ===== */
  span.lang-zh { display: none; }
  html.lang-zh span.lang-en { display: none; }
  html.lang-zh span.lang-zh { display: unset; }

  /* ===== Scroll reveal ===== */
  html.js [data-reveal] {
    will-change: opacity, transform;
  }
  html.js [data-reveal="section"],
  html.js [data-reveal="item"] {
    opacity: 0;
    transform: translate3d(0, 24px, 0);
    transition-property: opacity, transform;
    transition-timing-function: ease, cubic-bezier(0.22, 1, 0.36, 1);
  }
  html.js [data-reveal="section"] {
    transition-duration: 760ms;
  }
  html.js [data-reveal="item"] {
    transition-duration: 680ms;
  }
  html.js [data-reveal].is-visible {
    opacity: 1;
    transform: translate3d(0, 0, 0);
  }
  /* ===== Homepage dynamic effects ===== */
  .scroll-progress {
    position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 60;
    background: linear-gradient(90deg, #0058bc, #00a3c4, #ff7a45);
    transform: scaleX(0); transform-origin: 0 50%;
  }
  html, body { overflow-x: clip; }
  .hero-shell { position: relative; isolation: isolate; }
  .hero-lattice {
    position: absolute; z-index: -1; top: -6rem; left: calc(50% - 50vw);
    width: 100vw; height: calc(100% + 10rem);
    -webkit-mask-image: radial-gradient(ellipse at 35% 45%, #000 30%, transparent 75%);
            mask-image: radial-gradient(ellipse at 35% 45%, #000 30%, transparent 75%);
  }
  .role-caret { display: inline-block; margin-left: 2px; animation: caret-blink 1s steps(1) infinite; }
  @keyframes caret-blink { 50% { opacity: 0; } }
  .photo-tilt { transition: transform 0.25s ease-out; transform-style: preserve-3d; }
  .photo-glare {
    border-radius: 0.25rem; pointer-events: none; opacity: 0; transition: opacity 0.3s;
    background: radial-gradient(circle at var(--glare-x, 50%) var(--glare-y, 50%), rgba(255,255,255,0.35), transparent 55%);
  }
  .photo-tilt:hover .photo-glare { opacity: 1; }
  #honors .group { position: relative; }
  #honors .group::before {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: linear-gradient(90deg, #0058bc, #ff7a45);
    transform: scaleX(0); transform-origin: 0 50%; transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #honors .group:hover::before { transform: scaleX(1); }
  #honors .group:hover .honor-num { color: rgba(0,88,188,0.35) !important; }
  .honor-num { transition: color 0.4s; }
  #education > div, #projects .dark-card-bg, #publications article {
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s;
  }
  #education > div:hover, #projects .dark-card-bg:hover, #publications article:hover {
    transform: translateY(-4px); box-shadow: 0 18px 40px -20px rgba(0,88,188,0.35);
  }
  nav a.nav-active { color: #0058bc !important; }
  html.dark nav a.nav-active { color: #adc6ff !important; }

  @media (prefers-reduced-motion: reduce) {
    .role-caret { animation: none; }
    .photo-tilt, #education > div, #projects .dark-card-bg, #publications article { transition: none; transform: none !important; }
    html.js [data-reveal="section"],
    html.js [data-reveal="item"] {
      opacity: 1;
      transform: none;
      transition: none;
    }
  }
</style>
